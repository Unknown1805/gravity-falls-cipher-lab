<body class="bg-slate-100 text-slate-900">
  <header class="app-header">
    <a class="identity" href="#" aria-label="Gravity Falls Cipher Lab"><span class="mark">GF</span><span><strong>GRAVITY FALLS</strong><small>CIPHER LAB</small></span></a>
    <div class="header-actions">
      <span class="lab-label" id="lab-label">PHÒNG THÍ NGHIỆM MẬT MÃ</span>
      <div class="language-switch" aria-label="Language"><button data-action="language" data-lang="vi" aria-pressed="true">VI</button><button data-action="language" data-lang="en" aria-pressed="false">EN</button></div>

      <button class="icon-button" id="help-btn" data-action="help" title="Trợ giúp">?</button>
    </div>
  </header>
  <main>
    <div class="course-line"><span id="course-title">Mật mã cổ điển qua những lời nhắn bí mật</span><span id="course-meta">09 phân cảnh · VI / EN</span></div>
